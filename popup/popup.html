<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Note Names for MuseScore</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../icons/icon32.png" alt="" width="24" height="24">
    <h1>Note Names</h1>
    <label class="switch" title="Show / hide (Alt+N)">
      <input type="checkbox" id="enabled">
      <span></span>
    </label>
  </header>

  <button id="focus" class="focus" type="button" aria-pressed="false">
    <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M4 9V5a1 1 0 0 1 1-1h4M15 4h4a1 1 0 0 1 1 1v4M20 15v4a1 1 0 0 1-1 1h-4M9 20H5a1 1 0 0 1-1-1v-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <span>Focus mode</span>
    <kbd>Alt+Shift+F</kbd>
  </button>

  <main>
    <label class="row">
      <span>Naming</span>
      <select id="system">
        <option value="english">C D E F G A B</option>
        <option value="german">German (H, Fis, Es)</option>
        <option value="solfege">Do Re Mi … Si</option>
        <option value="solfege-ti">Do Re Mi … Ti</option>
      </select>
    </label>

    <label class="row">
      <span>Position</span>
      <select id="position">
        <option value="beside">Next to each note</option>
        <option value="above">Above the staff</option>
        <option value="below">Below the staff</option>
      </select>
    </label>

    <label class="row">
      <span>Size</span>
      <input type="range" id="size" min="1" max="4" step="0.1">
    </label>

    <label class="row">
      <span>Colour</span>
      <input type="color" id="color">
    </label>

    <label class="check"><input type="checkbox" id="colorByNote"> Colour each note letter differently</label>
    <label class="check"><input type="checkbox" id="octave"> Show octave numbers (C4 = middle C)</label>
    <label class="check"><input type="checkbox" id="asciiAccidentals"> Use # and b instead of ♯ and ♭</label>
  </main>

  <footer id="status">Open a score on musescore.com</footer>

  <script src="popup.js"></script>
</body>
</html>
